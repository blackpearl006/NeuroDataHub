<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Visitor Counter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
        }
        .container {
            text-align: center;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #333;
        }
        .visitor-counter {
            background: #4CAF50;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            display: inline-block;
            font-size: 16px;
            margin-top: 20px;
        }
        .count {
            font-weight: bold;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>My GitHub Page</h1>
        <p>This page uses CounterAPI to track visitors.</p>
        
        <div class="visitor-counter">
            👁️ Page Views: <span id="visitorCount" class="count">...</span>
        </div>
        
    </div>

    <script>
        // --- CounterAPI Configuration ---
        // Your public workspace slug (found in your CounterAPI dashboard)
        const WORKSPACE_SLUG = 'research'; 
        // The slug for the specific counter you created
        const COUNTER_SLUG = 'pageviews_neruodatahub';
        
        // --- The API Endpoint ---
        // We use the 'up' endpoint to increment the count
        const API_URL = `https://api.counterapi.dev/v1/${WORKSPACE_SLUG}/${COUNTER_SLUG}/up`;

        // Function to fetch the updated count from the API
        async function updateVisitorCount() {
            const visitorCountElement = document.getElementById('visitorCount');
            
            try {
                // The API requires a POST request to increment the counter
                const response = await fetch(API_URL, {
                    method: 'POST',
                    // No headers or body needed for this simple 'up' request
                });

                if (!response.ok) {
                    throw new Error(`API Error: ${response.status} ${response.statusText}`);
                }

                const data = await response.json();
                
                // The current count is available in the 'up_count' field
                const count = data.data.up_count;
                
                // Update the HTML element with the new count
                visitorCountElement.textContent = count;
                console.log('Visitor count updated to:', count);

            } catch (error) {
                console.error('Failed to update visitor count:', error);
                visitorCountElement.textContent = 'Error';
            }
        }

        // Call the function to update the count when the page loads
        updateVisitorCount();
    </script>
</body>
</html>
