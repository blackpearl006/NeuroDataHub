name: Docs

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r documentation/requirements.txt
      - name: Build docs (warnings are errors)
        run: sphinx-build -W --keep-going -b html documentation documentation/_build/html
